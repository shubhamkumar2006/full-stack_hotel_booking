version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: staynest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: staynest
      POSTGRES_PASSWORD: staynest_secret
      POSTGRES_DB: staynest_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U staynest -d staynest_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: staynest_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Express Backend ──────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: staynest_server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://staynest:staynest_secret@postgres:5432/staynest_db
      REDIS_URL: redis://redis:6379
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React Frontend ───────────────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: staynest_client
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - server

  # ── Nginx Reverse Proxy ──────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: staynest_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - server
      - client

  # ── Prometheus ───────────────────────────────────────
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    container_name: staynest_prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'

  # ── Grafana ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: staynest_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: staynest_grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
