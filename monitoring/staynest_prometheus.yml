global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'staynest-api'
    scrape_interval: 5s
    static_configs:
      - targets: ['server:5000']
        labels:
          env: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
